name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        shell: powershell
        run: .\tests\Test-Release.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DellG15FanControl
          path: |
            dist/DellG15FanControl.exe
            dist/SHA256SUMS.txt
