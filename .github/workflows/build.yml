name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify
        shell: powershell
        run: .\tests\Test-Release.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: DellG15FanControl
          path: |
            dist/DellG15FanControl.exe
            dist/SHA256SUMS.txt
